<html>
    <head>
        <title>Education</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                margin: 0;
                background: linear-gradient(135deg, #dbeafe, #f0f9ff) ;
                color: #333;
                line-height: 1.6;
                background-image: url('./bg3.jpg');
                background-size: cover;
            }
            .all{
            max-width: 800px;
            height: 465px;
            margin: 80px auto;
            background: #ffffff;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            background-image: url('./inside2.jpg');
            background-size: cover;
            background-position: center; 
            }
            h1{
                text-align: center;
                color: #007bff;
                font-size: 30px;
                margin-bottom: 20px;
                position: relative;
            }
            .edu{
                margin-bottom: 25px;
                padding-left: 15px;
                border-left: 2px solid#e0e0e0;
                position: relative;
            }
            .c1{
                font-size: 19px;
                font-weight: bold;
                color: #1a1a1a;
            }
            .c2{
                font-size: 16px;
                color:#555;
                margin-top: 2px;
            }
            .c3{
                font-size: 14px;
                color: #777;
                margin-top: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .score{
                background: #f0f4fa;
                padding: 3px 8px;
                border-radius: 4px;
                font-weight: bold;
                color: #333;
            }



            
        </style>
    </head>
    <body>
        <div class="all">
            <h1>My Education</h1>

            <div class="edu">
                <div class="c1">B.E. CSE(Artificial Intelligence)</div>
                <div class="c2">Saveetha School Of Engineering, Chennai</div>
                <div class="c3">
                    <span>2023-2027</span>
                    <span class="score">CGPA:8.73</span>
                </div>
            </div>

            <div class="edu">
                <div class="c1">Intermediate(+2)</div>
                <div class="c2">SR Junior College, Tirupati</div>
                <div class="c3">
                    <span>2021-2023</span>
                    <span class="score">Percentage: 97</span>
                </div>
            </div>

            <div class="edu">
                <div class="c1">High School (10th Grade)</div>
                <div class="c2">Silver Bells E M High School, Rly Kodur</div>
                <div class="c3">
                    <span>2020-2021</span>
                    <span class="score">Percentage: 99</span>
                </div>
            </div>
        </div>
    </body>
</html>
